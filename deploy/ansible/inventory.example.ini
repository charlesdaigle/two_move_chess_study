# Copy to inventory.ini and edit hosts/addresses/users.
#
# twomove_slices  : which shard slices (of twomove_shard_total) this node plays.
#                   Faster nodes get more slices. Slices must partition
#                   0..twomove_shard_total-1 across all nodes.
# twomove_workers : parallel games per slice service (cores to use).
# twomove_memory_max : systemd MemoryMax for each shard service ("" = no cap).

# Full-auto mode runs ansible ON the controller (coralreef), so the controller
# is connection=local and the nodes are reached over SSH from it.

# Addressing (deploy/PROVISIONING.md "Reaching the nodes"): mDNS .local names
# by default — router-independent, survives DHCP lease changes; Pi OS ships
# avahi enabled. If you have router admin access, DHCP-reserve by MAC and pin
# IPs here instead. Record each node's MAC in a comment once known
# (ip link show wlan0) — it's the one identifier that never changes.

[pis]
coralreef ansible_connection=local twomove_slices='[0, 1]' twomove_workers=4 twomove_memory_max=''
node1     ansible_host=node1.local ansible_user=moos-node twomove_slices='[2]' twomove_workers=1 twomove_memory_max='380M'   # MAC: <fill in>
node2     ansible_host=node2.local ansible_user=moos-node twomove_slices='[3]' twomove_workers=1 twomove_memory_max='380M'   # MAC: <fill in>

[pis:vars]
ansible_ssh_private_key_file=~/.ssh/twomove_fleet

# The GitOps agent (agent.yml) installs here:
[controller]
coralreef ansible_connection=local
